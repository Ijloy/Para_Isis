<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Isis</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#fff8ef; --rose:#e8576f; --orange:#f28a1a; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family:'Quicksand', sans-serif; color:#fff; user-select:none;
    background:linear-gradient(180deg,#0b1026 0%,#1b1f4b 45%,#4a2c5e 80%,#7a3f63 100%);
  }

  /* Estrellas */
  #stars { position:fixed; inset:0; pointer-events:none; }
  .star { position:absolute; background:#fff; border-radius:50%; opacity:.2;
          animation:twinkle var(--d) ease-in-out infinite; animation-delay:var(--delay); }
  @keyframes twinkle { 50% { opacity:1; } }

  /* Título */
  header { position:fixed; top:0; left:0; right:0; text-align:center; padding:22px 16px 0;
           z-index:5; pointer-events:none; }
  header h1 { font-family:'Dancing Script', cursive; font-size:clamp(30px,7.5vw,48px);
              text-shadow:0 0 18px rgba(255,180,200,.6); }
  header p { font-size:14px; opacity:.8; margin-top:4px; }

  #counter { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); font-size:13px;
             background:rgba(255,255,255,.12); padding:6px 14px; border-radius:20px; z-index:5;
             backdrop-filter:blur(4px); white-space:nowrap; }

  #sky { position:fixed; inset:0; z-index:2; }
  .item { position:absolute; left:0; top:0; cursor:pointer; will-change:transform;
          filter:drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  .item .inner { position:absolute; inset:0; transition:transform .2s; }
  .item:hover .inner { transform:scale(1.12); }

    width:min(88vw,380px); color:#5a3a3a; border-radius:14px; padding:30px 24px 24px;
    text-align:center; position:relative; box-shadow:0 20px 50px rgba(0,0,0,.5);
    background:var(--paper);
    background-image:repeating-linear-gradient(transparent 0 31px, rgba(200,150,150,.18) 31px 32px);
    transform:scale(.6) rotate(-6deg); transition:transform .45s cubic-bezier(.2,1.4,.4,1);
  }
  #overlay.show .letter { transform:scale(1) rotate(0); }
  .letter .num { display:none; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#c07a86; }
  .letter .msg { font-family:'Dancing Script', cursive; font-size:clamp(24px,6.2vw,30px);
                 line-height:1.35; margin:6px 0 14px; min-height:90px; }
  .letter .sign { font-family:'Dancing Script', cursive; font-size:21px; color:#8a5560;
                  margin-bottom:18px; opacity:0; transition:opacity .5s; }
  .letter .sign.show { opacity:1; }
  .letter button { border:none; background:var(--rose); color:#fff; font-family:inherit;
                   font-weight:600; font-size:15px; padding:10px 24px; border-radius:24px;
                   cursor:pointer; box-shadow:0 4px 12px rgba(232,87,111,.4); }

  /* Modo foto (mandarina) */
  .photo { display:none; margin:0 0 18px; }
  .photo img { width:100%; max-height:56vh; object-fit:contain; border-radius:6px;
               background:#fff; padding:8px 8px 28px; box-shadow:0 6px 16px rgba(0,0,0,.2);
               transform:rotate(-1.5deg); }
  .photo .vacio { padding:40px 10px; border:2px dashed #f0a65c; border-radius:10px;
                  color:#c06a10; font-size:14px; }
  .letter.foto { background:#fff3e3; background-image:none; }
  .letter.foto .msg, .letter.foto .sign { display:none; }
  .letter.foto .photo { display:block; }
  .letter.foto .num { color:#d0761a; }
  .letter.foto button { background:var(--orange); box-shadow:0 4px 12px rgba(242,138,26,.4); }

  /* Corazones al abrir */
  .burst { position:fixed; z-index:11; pointer-events:none; font-size:var(--s); color:var(--col);
           animation:fly 1.1s ease-out forwards; }
  @keyframes fly { to { transform:translate(var(--dx),var(--dy)) scale(.4); opacity:0; } }
</style>
</head>

/* ============================================================ */

const sky = document.getElementById('sky');
const overlay = document.getElementById('overlay');
const letter = document.getElementById('letter');
const msgEl = document.getElementById('msg');
const numEl = document.getElementById('num');
const signEl = document.getElementById('sign');
const photoEl = document.getElementById('photo');
const closeBtn = document.getElementById('close');

document.getElementById('titulo').textContent = TITULO;

// Estrellas de fondo
const starsBox = document.getElementById('stars');
for (let i = 0; i < 90; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2 + 1;
  s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*3}s;--delay:${Math.random()*3}s`;
  starsBox.appendChild(s);
}

const barajar = n => Array.from({length:n}, (_, i) => i).sort(() => Math.random() - 0.5);

// Mensajes en orden aleatorio, sin repetirse
let colaMsg = barajar(MENSAJES.length), abiertas = 0;
// Fotos en orden aleatorio; al terminar se vuelven a barajar
let colaFotos = barajar(FOTOS.length), fotosVistas = new Set();

function actualizarContador() {}

const COLORES = [
  ['#fff4e6', '#f6dcc2'], ['#ffe3ea', '#f7c2cf'], ['#f3e8ff', '#dcc6f5'],
  ['#e6f4ff', '#c4dff5'], ['#fff9d6', '#f2e3a0']
];

let objetos = [], pausado = false;

function crearObjeto(yInicial) {
  const W = window.innerWidth, H = window.innerHeight;
  const esMandarina = Math.random() < 0.35;
  const el = document.createElement('div');

  if (esMandarina) {
    el.className = 'item mand';
    el.innerHTML = '<div class="inner"><div class="fruit"></div></div>';
  } else {
    const [c, f] = COLORES[Math.floor(Math.random() * COLORES.length)];
    el.className = 'item env';
    el.style.setProperty('--c', c);
    el.style.setProperty('--f', f);
    el.innerHTML = '<div class="inner"><div class="card"></div></div>';
  }

  const obj = {
    el, tipo: esMandarina ? 'mand' : 'carta',
    w: esMandarina ? 62 : 80,
    h: esMandarina ? 62 : 54,
    y: yInicial ?? -70,
    vx: (18 + Math.random() * 35) * (Math.random() < 0.5 ? -1 : 1),
    vy: (35 + Math.random() * 45) * Math.max(0.8, H / 800),
    fase: Math.random() * Math.PI * 2,
    amp: 15 + Math.random() * 25,
    rot: Math.random() * 40 - 20,
    vr: (Math.random() * 30 - 15) * (esMandarina ? 2 : 1),
    escala: 0.85 + Math.random() * 0.4
  };
  // Radio que ocupa la carta aunque esté girada, para que nunca se corte en los bordes
  obj.r = Math.hypot(obj.w, obj.h) / 2 * obj.escala + 4;
  obj.cx = obj.r + Math.random() * Math.max(1, W - 2 * obj.r);
  el.addEventListener('click', (e) => abrir(obj, e));
  sky.appendChild(el);
  objetos.push(obj);
}

const maxObjetos = () => window.innerWidth < 600 ? 9 : 14;

// Algunos desde el inicio para que la pantalla no esté vacía
for (let i = 0; i < 6; i++) crearObjeto(Math.random() * window.innerHeight * 0.6);

setInterval(() => {
  if (!pausado && objetos.length < maxObjetos()) crearObjeto();
}, 650);

let ultimo = performance.now(), t = 0;
function animar(ahora) {
  const dt = Math.min((ahora - ultimo) / 1000, 0.05);
  ultimo = ahora;
  if (!pausado) {
    t += dt;
    const H = window.innerHeight;
    objetos = objetos.filter(o => {
      o.y += o.vy * dt;
      o.rot += o.vr * dt;
      const W = window.innerWidth;
      o.cx += o.vx * dt;
      if (o.cx < o.r) { o.cx = o.r; o.vx = Math.abs(o.vx); o.vr = -o.vr; }
      if (o.cx > W - o.r) { o.cx = W - o.r; o.vx = -Math.abs(o.vx); o.vr = -o.vr; }
      const x = o.cx - o.w / 2;
      o.el.style.transform = `translate(${x}px, ${o.y}px) rotate(${o.rot}deg) scale(${o.escala})`;
      if (o.y > H + 60) { o.el.remove(); return false; }
      return true;
    });
  }
  requestAnimationFrame(animar);
}
requestAnimationFrame(animar);

function estallido(x, y, tipo) {
  const cols = tipo === 'mand'
    ? ['#ffa531', '#ffc46b', '#ff8a00', '#ffd08a', '#5cc46a']
    : ['#ff6b8b', '#ffb3c6', '#ff8fab', '#ffd1dc', '#e8576f'];
  for (let i = 0; i < 14; i++) {
    const h = document.createElement('span');
    h.className = 'burst';
    h.textContent = '❤';
    const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 90;
    h.style.cssText = `left:${x}px;top:${y}px;--s:${12+Math.random()*16}px;--col:${cols[i%cols.length]};--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist}px`;
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1200);
  }
}

let escritura;
function mostrarCarta(etiqueta, texto) {
  letter.classList.remove('foto');
  numEl.textContent = etiqueta;
  msgEl.textContent = '';
  signEl.textContent = FIRMA;
  signEl.classList.remove('show');
  closeBtn.textContent = 'Seguir';
  overlay.classList.add('show');
  clearInterval(escritura);
  const letras = Array.from(texto);
  let i = 0;
  escritura = setInterval(() => {
    msgEl.textContent += letras[i++];
    if (i >= letras.length) { clearInterval(escritura); signEl.classList.add('show'); }
  }, 38);
}

function mostrarFoto() {
  letter.classList.add('foto');
  closeBtn.textContent = 'Seguir';
  photoEl.innerHTML = '';
  if (!FOTOS.length) {
    numEl.textContent = '';
    photoEl.innerHTML = '<div class="vacio">Aquí irá una foto</div>';
  } else {
    if (!colaFotos.length) colaFotos = barajar(FOTOS.length);
    const i = colaFotos.shift();
    fotosVistas.add(i);
    actualizarContador();
    numEl.textContent = `Mandarina ${fotosVistas.size} de ${FOTOS.length}`;
    const img = document.createElement('img');
    img.src = FOTOS[i];
    img.alt = '';
    photoEl.appendChild(img);
  }
  overlay.classList.add('show');
}

function abrir(obj, e) {
  if (pausado) return;
  pausado = true;
  estallido(e.clientX, e.clientY, obj.tipo);
  obj.el.remove();
  objetos = objetos.filter(o => o !== obj);

  if (obj.tipo === 'mand') {
    setTimeout(mostrarFoto, 250);
    return;
  }

  let indice, etiqueta;
  if (colaMsg.length > 0) {
    indice = colaMsg.shift();
    abiertas++;
    actualizarContador();
    etiqueta = `Carta ${abiertas} de ${MENSAJES.length}`;
  } else {
    indice = Math.floor(Math.random() * MENSAJES.length);
    etiqueta = 'Una más';
  }
  setTimeout(() => mostrarCarta(etiqueta, MENSAJES[indice]), 250);
}

closeBtn.addEventListener('click', () => {
  clearInterval(escritura);
  overlay.classList.remove('show');
  setTimeout(() => { pausado = false; }, 320);
});
</script>
